<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件预览</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#4c5e78;background:#f5f7fb;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:17px 22px;background:#fff;border-bottom:1px solid #e6ecf5}h1{font-size:14px;margin:0;flex:1;overflow-wrap:anywhere}button,a{border:1px solid #dfe6f2;border-radius:7px;background:#fff;color:#72839e;padding:7px 12px;font:inherit;font-size:11px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:default}nav{padding:10px 22px;display:flex;gap:7px;overflow:auto}nav button.active{background:#eaf0ff;color:#4e6dc0;border-color:#bdccf6}.notice{font-size:11px;line-height:1.8;color:#8b9bb3;padding:0 22px 12px}.grid{overflow:auto;flex:1;background:white;border-top:1px solid #e4eaf4}table{border-collapse:collapse;font-size:11px;min-width:100%}th,td{padding:9px 12px;border:1px solid #ecf0f6;min-width:110px;max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}th{position:sticky;top:0;background:#f0f4fb;color:#8a9ab4;font-weight:500}.row{min-width:45px;color:#9ba7b8;background:#f8fafd}footer{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:13px 22px;background:white;border-top:1px solid #e4eaf4;font-size:11px}.error{padding:40px;color:#9a7e71;font-size:13px}.watermark{position:fixed;pointer-events:none;inset:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);align-content:space-around;opacity:.055;overflow:hidden}.watermark span{transform:rotate(-24deg);font-size:15px;text-align:center;white-space:nowrap}@media(max-width:650px){header{flex-wrap:wrap}h1{flex-basis:65%}footer{gap:8px;padding:10px}}
</style></head><body><header><a href="/">返回文件中心</a><h1 id="title">正在读取文件…</h1><button id="retry">刷新预览</button></header><nav id="sheets"></nav><div id="notice" class="notice">服务端分页预览，仅返回当前页数据。</div><main class="grid" id="grid" aria-live="polite"></main><footer><span id="info"></span><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer><div id="watermark" class="watermark" aria-hidden="true"></div><script>
const id=new URLSearchParams(location.search).get('id');let sheet='',page=1,busy=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(busy||!id)return;busy=true;$('prev').disabled=$('next').disabled=true;$('grid').innerHTML='<div class="error">正在读取当前页…</div>';
 try{const token=sessionStorage.getItem('fileFinderAccessToken')||'';const response=await fetch(`/api/file/${encodeURIComponent(id)}/preview-data?`+new URLSearchParams({sheet,page,page_size:100}),{headers:token?{'X-App-Token':token}:{}});const d=await response.json();if(!response.ok)throw Error(typeof d.detail==='string'?d.detail:'预览失败，请重新登录或重试');
 sheet=d.sheet;$('title').textContent=d.name;document.title=d.name+' · 文件预览';$('sheets').innerHTML=d.sheets.map((name,index)=>`<button data-sheet="${index}" class="${name===sheet?'active':''}">${esc(name)}</button>`).join('');$('sheets').querySelectorAll('button').forEach(button=>button.onclick=()=>{if(busy)return;sheet=d.sheets[Number(button.dataset.sheet)];page=1;load();});
 $('notice').textContent='仅预览前 10,000 行、100 列，单元格最多 2,000 字符；公式显示已保存的计算值，不执行公式。'+(d.truncated?' 此文件已达到预览范围上限。':'')+' 原文件请回文件中心申请下载。';
 $('grid').innerHTML=`<table><thead><tr><th class="row">行</th>${Array.from({length:d.column_count},(_,i)=>`<th>列 ${i+1}</th>`).join('')}</tr></thead><tbody>${d.rows.map((row,i)=>`<tr><td class="row">${d.start_row+i}</td>${Array.from({length:d.column_count},(_,j)=>`<td>${esc(row[j])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 $('page').textContent=`第 ${page} 页`;$('info').textContent=`${d.rows_truncated?'已读取前':'共'} ${d.row_count} 行 · ${d.column_count} 列`;$('prev').disabled=page<=1;$('next').disabled=!d.has_more;
 }catch(error){$('grid').innerHTML=`<div class="error">${esc(error.message)}<p>可以点击“刷新预览”重试。</p></div>`;}finally{busy=false;}}
$('retry').onclick=load;$('prev').onclick=()=>{page--;load();};$('next').onclick=()=>{page++;load();};
fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.user)$('watermark').innerHTML=Array.from({length:12},()=>`<span>${esc(d.user.name+' '+d.user.phone+' · 仅供预览')}</span>`).join('');}).catch(()=>{});
if(id)load();else $('grid').textContent='缺少文件参数';
</script></body></html>
