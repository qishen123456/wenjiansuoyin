<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>文件预览 · 文件资产中心</title>
  <link rel="stylesheet" href="/static/theme.css?v=20261112-pine">
  <link rel="stylesheet" href="/static/preview.css?v=20261112-document-types">
  <script src="/static/preview.js?v=20261113-document-types" defer></script>
</head>
<body>
  <header class="reader-shell" id="readerShell">
    <a class="reader-brand" href="/" aria-label="返回文件资产中心">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6l2 2h8v12H4z"/><path d="M4 10h16"/></svg>
      文件资产中心
    </a>
    <span>文档阅读</span>
  </header>
  <main class="reader" id="reader">
    <a class="reader-back" id="back" href="/">‹ 返回文件中心</a>
    <section class="file-heading" aria-labelledby="title">
      <div class="file-symbol" aria-hidden="true">
        <svg viewBox="0 0 32 38"><path d="M6 2h13l7 7v26H6z"/><path d="M19 2v8h7M11 17h10M11 22h10M11 27h6"/></svg>
      </div>
      <div class="file-identity">
        <h1 id="title">正在读取文件…</h1>
        <p class="original-name" id="originalName"></p>
        <div class="file-meta"><span id="fileType">文档预览</span><span id="permission" role="status">正在读取权限</span></div>
      </div>
      <div class="reader-actions">
        <button id="retry" class="button" type="button">刷新预览</button>
        <a id="standalone" class="button" target="_blank" rel="noopener" hidden>独立窗口 <span aria-hidden="true">↗</span></a>
        <button id="download" class="button primary" type="button" disabled>下载原件</button>
      </div>
    </section>
    <p id="actionStatus" class="action-status" role="status" hidden></p>
    <section class="download-request" id="downloadRequest" aria-labelledby="requestTitle" hidden>
      <div><h2 id="requestTitle">申请下载原件</h2><p>预览权限不包含原件下载，审批通过后可获取完整文件。</p></div>
      <form id="requestForm">
        <label for="downloadReason">下载用途</label>
        <textarea id="downloadReason" name="reason" maxlength="200" required placeholder="请说明用途，方便管理员审批"></textarea>
        <p class="form-error" id="requestError" role="alert" hidden></p>
        <div class="reader-actions"><button class="button primary" id="submitRequest" type="submit">提交申请</button><button class="button" id="cancelRequest" type="button">取消</button></div>
      </form>
    </section>
    <section class="document" aria-label="文件内容">
      <div class="document-toolbar">
        <nav id="sheets" class="sheet-tabs" aria-label="工作表"></nav>
        <div id="mediaTools" class="media-tools" aria-label="页面查看操作" hidden>
          <button id="zoomMedia" class="button" type="button" aria-pressed="false">放大</button>
          <button id="rotateLeft" class="button" type="button" aria-label="向左旋转 90 度">向左旋转</button>
          <button id="rotateRight" class="button" type="button" aria-label="向右旋转 90 度">向右旋转</button>
        </div>
        <span class="readonly"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5"/><path d="M5.5 7V4a2.5 2.5 0 0 1 5 0v3"/></svg>只读预览</span>
      </div>
      <div class="document-content">
        <div class="grid" id="grid" role="region" aria-label="当前页文件内容" aria-busy="true" tabindex="0">
          <div class="reader-state"><span class="loading-mark" aria-hidden="true"></span><p>正在读取文件内容…</p></div>
        </div>
        <div id="watermark" class="watermark" aria-hidden="true"></div>
      </div>
      <footer class="document-footer">
        <span id="info" role="status">正在准备预览</span>
        <div class="pagination"><button id="prev" class="button" type="button" disabled>上一页</button><span id="page" aria-live="polite">—</span><button id="next" class="button" type="button" disabled>下一页</button></div>
      </footer>
    </section>
    <div class="preview-note"><span class="note-mark" aria-hidden="true">i</span><p id="notice">仅加载当前页内容，原始文件保持不变。</p></div>
  </main>
</body>
</html>
