name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fast_file_finder/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fast_file_finder/requirements.txt
          pip install -r fast_file_finder/dev-requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q fast_file_finder
      - name: Run integration tests
        run: pytest -q fast_file_finder/tests